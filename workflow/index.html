<!doctype html><html lang="en"><head><script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('tscTheme')==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Inspection Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: path tabs; each path is a row of phase columns, steps stacked top to bottom with connector lines. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14233a; --muted:#51627a; --line:#cfd8e3;
  --navy:#0b3d6b; --navy-soft:#dbe8f6;
  --signal:#f2b705; --signal-soft:#fff3cf; --signal-ink:#6b4b00;
  --new:#1b7f5a; --new-soft:#dff3ea;
  --out:#e7ebf0; --out-ink:#44566b;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media all{:root[data-theme="dark"]{
  --bg:#0c1522; --surface:#142235; --ink:#e6edf6; --muted:#9db0c6; --line:#2b3d55;
  --navy:#6fb0ee; --navy-soft:#173a5e; --signal:#f2b705; --signal-soft:#3a2f0c; --signal-ink:#f5d572;
  --new:#4fd0a0; --new-soft:#12392c; --out:#1c2c42; --out-ink:#a9bbd0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1522; --surface:#142235; --ink:#e6edf6; --muted:#9db0c6; --line:#2b3d55;
  --navy:#6fb0ee; --navy-soft:#173a5e; --signal:#f2b705; --signal-soft:#3a2f0c; --signal-ink:#f5d572;
  --new:#4fd0a0; --new-soft:#12392c; --out:#1c2c42; --out-ink:#a9bbd0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,48px);letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:2px solid var(--navy);background:var(--surface)}
.legend i.o{background:var(--out);border-color:var(--out-ink)}
.legend i.d{background:var(--signal-soft);border-color:var(--signal)}
.legend i.n{background:var(--new-soft);border:2px dashed var(--new)}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
nav button{font:600 14px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:44px}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
@media all{:root[data-theme="dark"] nav button[aria-selected="true"]{color:#06182b}}
:root[data-theme="dark"] nav button[aria-selected="true"]{color:#06182b}
nav button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.blurb{margin:10px 0 18px;color:var(--muted);max-width:75ch}
.tag{display:inline-block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--new-soft);color:var(--new);margin-left:8px;vertical-align:2px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.lane{min-width:0}
.lane h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;padding:6px 10px;background:var(--navy-soft);color:var(--navy);border-radius:4px}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;background:var(--surface);border:2px solid var(--navy);border-radius:10px;padding:12px 14px 12px 50px;margin-bottom:26px;box-shadow:0 1px 3px rgba(11,61,107,.12)}
.step:not(:last-child)::after{content:"";position:absolute;left:50%;top:100%;height:26px;width:2px;background:var(--navy)}
.step:not(:last-child)::before{content:"";position:absolute;left:calc(50% - 5px);top:calc(100% + 15px);border:6px solid transparent;border-top:9px solid var(--navy);border-bottom:0;z-index:1}
.step .n{position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font:700 14px var(--mono);display:grid;place-items:center}
@media all{:root[data-theme="dark"] .step .n{color:#06182b}}
:root[data-theme="dark"] .step .n{color:#06182b}
.step b{display:block;font-size:16px;line-height:1.25}
.step p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.step.out{background:var(--out);border-color:var(--out-ink);box-shadow:none}
.step.out .n{background:var(--out-ink)}
.step.out::after{background:var(--out-ink)}
.step.dec{background:var(--signal-soft);border-color:var(--signal)}
.step.dec .n{background:var(--signal);color:#2b2100}
.step.new{background:var(--new-soft);border:2px dashed var(--new);box-shadow:none}
.step.new .n{background:var(--new)}
.br{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.br span{font-size:12.5px;padding:3px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.br span em{font:700 11px var(--mono);font-style:normal;margin-right:6px;color:var(--signal-ink)}
.note{margin-top:8px;padding:12px 14px;border-left:4px solid var(--signal);background:var(--surface);border-radius:0 6px 6px 0;color:var(--muted);max-width:80ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.rule h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:19px;margin:0 0 6px;color:var(--navy)}
.rule p{margin:0;color:var(--muted);font-size:14px}
code{font:13px var(--mono);background:var(--navy-soft);color:var(--navy);padding:2px 6px;border-radius:3px;overflow-wrap:anywhere}
.lane h2{display:flex;justify-content:space-between;gap:8px}
.lane h2 .sub{white-space:nowrap;font:600 14px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink)}
.tm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.tm input{width:88px;min-height:40px;font:600 15px var(--mono);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:4px 8px}
.tm input:focus{outline:3px solid var(--signal);outline-offset:1px;border-color:var(--navy)}
.total{position:sticky;bottom:0;margin-top:18px;padding:12px 16px;background:var(--navy);color:#fff;border-radius:8px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;font-size:16px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media all{:root[data-theme="dark"] .total{color:#06182b}}
:root[data-theme="dark"] .total{color:#06182b}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.step{transition:transform .15s}.step:hover{transform:translateY(-1px)}}
</style>

<script>
var A='app',O='out',D='dec',N='new';
var PATHS={
repair:{label:'Repair',blurb:'Customer unit comes in, issues are identified and corrected, and a summary report is submitted. No ATP, Floor Test or Jake’s Final on a repair.',
 lanes:[
 {n:'Intake',s:[
  [A,'Intake','Customer-reported issues, core data, photos, failed lines. Makes the Intake QR.'],
  [A,'RMA prompt','Before inspection starts: RMA, service order and account indicator (ZM, Z1, Z2, Z3 or other).'],
  [A,'Intake PDF','Folder front page and bin tag page lead the PDF. Photo zip downloads with it.'],
  [O,'Print and file','Front page in the folder sleeve. Bin tag on the customer property bin.']]},
 {n:'Repair',s:[
  [D,'Non-warranty items?','Any item marked non-warranty is quoted first. On a Z2 account every item counts unless it is marked warranty.',['Yes','Z2 Quote first'],['No','Straight to Post-Repair']],
  [A,'Z2 Quote','Scan the Intake QR. Each non-warranty item becomes an issue with its parts, quantities and estimated labor hours. No prices – pricing is added in SAP. The quote PDF goes to TSC@teledyne.com.'],
  [O,'Customer approves or declines','The quote is priced in SAP and sent to the customer.'],
  [A,'Post-Repair: identify issues','Scan the Intake QR, or the Z2 Quote QR if there was a quote: each quoted issue is marked Approved or Declined, and a declined issue is reported as not repaired. Core data and the customer-reported issues load. The tech adds anything else found.'],
  [O,'Correct the issues','The tech repairs each identified issue.'],
  [A,'Mark issues corrected','Back in Post-Repair, each corrected issue is marked repaired, with notes, parts and photos.'],
  [D,'TFU changed?','If the TFU was replaced during the repair, it must be calibrated. Calibration is for the TFU only, not the radar or PTU.',['Yes','Run TFU to Radar Cal'],['No','Go to the report']]]},
 {n:'Report and release',s:[
  [A,'Summary report','Everything checked, everything identified as faulty, anything repaired, and the technician\u2019s notes.'],
  [O,'Release to customer','The vehicle goes back to the customer. No ATP is run on a repair.']]}]},
upfit:{label:'Upgrade / upfit',blurb:'Same trip through the shop, but parts are swapped for newer ones, so old and new serial numbers are tracked.',
 lanes:[
 {n:'Intake',s:[
  [A,'Intake','Mark the unit as an upgrade. Capture core data and the swap list (old serial to new serial).'],
  [A,'RMA prompt','RMA, service order and account indicator before inspection starts.'],
  [A,'Intake PDF','Bin tag shows the serial and the updated serial.'],
  [O,'Print and file','Front page in the folder sleeve. Tech ticks downstream checks on paper.']]},
 {n:'Disassembly and build-up',s:[
  [O,'Vehicle prep','Engine bay setup, undercarriage, cable runs, skid runners in the bed, cab preparation. Runs while the skid is prepped. First line on the folder front page.'],
  [A,'Skid prep','Reconfigure the enclosures, fit the skid adapters, bolt the network enclosure to the skid. Scan the Intake QR. New serials are entered as parts go in. Cameleon Advanced tab checked.'],
  [A,'Floor Test','From here on the truck goes by its new eMSC-L / M2S2 serial; the LVSS serial is shown as the previous serial. Carries RMA and the new serials forward. Photo zip downloads with the PDF. Whether upfit keeps this step is still to be confirmed.'],
  [A,'Jake\u2019s Final (ad hoc test)','Final check against the upgraded configuration, before the ATP. Also still to be confirmed for upfit.'],
  [D,'TFU changed?','If the TFU was replaced or upgraded, run the calibration form. It is for the TFU only, not the radar or PTU.',['Yes','Calibration, then ATP'],['No','Straight to ATP']]]},
 {n:'Accept',s:[
  [A,'ATP','New serials and the Windows activation key are used. The ATP shows \u201cReplaces old serial\u201d.'],
  [D,'Any punch items?','Same rule as repair.',['Yes','Corrections, then audit'],['No','Go to the final report']],
  [A,'Punch list corrections','The technician fixes each punch list item.'],
  [A,'ATP audit','A different person re-checks only the originally failed items until they pass.'],
  [A,'Final report and pass certificate','Overall ATP, any issues and how each was addressed, then the ATP pass certificate.']]},
 {n:'Close out',s:[
  [N,'DD1149','Uses the new serial and shows the old one.'],
  [O,'Ship','Folder shows old and new serials. Paperwork goes with the unit.']]}]},
build:{label:'New build',proposed:1,blurb:'Proposed, not built yet. The government supplies the F-250. Devices, sensors and enclosures arrive later.',
 lanes:[
 {n:'Truck build',s:[
  [N,'Intake (new build)','Short form, no device list. VIN, Kilo # or Fleet #, plate, mileage, condition and photos. Planned eMSC-L or M2S2 serial if known; if not, the truck is known by VIN, kilo and plate.'],
  [N,'Vehicle prep','Engine bay setup, undercarriage, cable runs, skid runners in the bed, cab preparation, fit checks. Runs while production builds the skids and enclosures. Mark \u201cprepped, waiting on devices\u201d and park the record.']]},
 {n:'Enclosures received',s:[
  [O,'Skid prep','Camera, radar and TFU arrive new from the factory. Install them on the skid with the server and LCU.'],
  [N,'Floor Test','Bench test off the battery enclosure: camera, LCU, pan/tilt, radar. Device serials are captured here. A borrowed or floated-in unit can be marked \u201cTest unit\u201d so a missing device never stops the test.'],
  [D,'Floor Test passed?','',['Yes','Install in the cab'],['No','Fix and retest']],
  [O,'Install in the cab','Center console fitted temporarily; the LMR radio mounts to it. Cab integration.'],
  [O,'LMR radio install (if applicable)','Customer-specific. Can happen once the truck is prepped, any time before or after the skid goes on, or after delivery. The truck leaves for a few days; log out and back dates.'],
  [N,'Skid installed on truck (major step)','Network enclosure married to the skid, forklifted into the bed, set down with four bolts (top left, top right, bottom left, bottom right). Power on and verify everything works. Deploy the skid outside, then install the four remaining bolts: eight bed bolts in all. Scan the truck QR to link truck and skid. If the skid serial changed from the plan, the app flags it.'],
  [O,'Dressing','Cable and hardware dressing.'],
  [A,'Jake\u2019s Final (ad hoc test)','Ad hoc testing before the ATP. Final items addressed here.'],
  [A,'TFU to Radar Cal','Normally after integration. May happen later.']]},
 {n:'ATP and punch list',s:[
  [A,'ATP','Acceptance test. Ideally the tech runs it earlier; to be raised with the site manager.'],
  [A,'Punch list corrections','Technicians correct each item on the punch list.'],
  [A,'ATP audit','A different person verifies the corrections until every item passes.'],
  [A,'Final report and pass certificate','Overall ATP, any issues and how each was addressed, then the ATP pass certificate.']]},
 {n:'Customer',s:[
  [O,'Customer inspection (PIVCO)','Customer acceptance.'],
  [N,'DD1149','Sign-off form. Ravi to provide the form.'],
  [O,'Final delivery','']]}]},
audit:{label:'Punch list and audit',blurb:'The ATP finds problems, the repair tech fixes them, and a different person checks only what failed.',
 lanes:[
 {n:'Find',s:[
  [A,'ATP finds problems','Failed lines become a punch list with a disposition: repair, advise, courtesy or TBD.'],
  [A,'Punch list QR','Carries the punch list and the RMA so nobody retypes it.']]},
 {n:'Fix',s:[
  [A,'Technician mode','Repair tech scans the QR and logs what was fixed. Output is the Repairs Completed record.'],
  [D,'Who is auditing?','The auditor cannot be the tech who did the repair.',['Same person','Blocked'],['Different person','Continue']]]},
 {n:'Check',s:[
  [A,'Auditor mode','Scans the same QR. Only the originally failed items appear.'],
  [A,'Re-check','Auditor confirms each failed item is fixed. Passed items are not re-inspected.'],
  [A,'Audit PDF','Saved as RMA-SERIAL-AUDIT. Photos download as a zip.']]},
 {n:'File',s:[
  [O,'Back to the folder','Printed audit goes in the folder so the boss can see it is closed out.']]}],
 note:'Repair items are fixed and re-checked. Advise and courtesy items are listed for the customer without a repair.'},
carry:{label:'What carries',rules:[
 ['Core data','Platform and device serials, VIN, plate, kilo, SW/FW revs, mileage, engine and idle hours. Mileage and hours show as the “last reading”, never prefilled. Serial inputs default to CAPS.'],
 ['Intake QR','Core data first, then the RMA, then the work list: customer-reported issues, failed lines and tech notes. If space runs out, notes shrink first, then items drop.'],
 ['RMA prompt','Asked before any inspection: RMA, service order, account indicator. Can be skipped; files then use X in place of the RMA.'],
 ['RMA carry-over','Scanning a QR from an earlier form fills the RMA on the next one. Typing it works too.'],
 ['File naming','<code>RMA 5512-SERIAL-TYPE-MM-DD-YY</code><br>No RMA: <code>X-SERIAL-TYPE-MM-DD-YY</code><br>Types: INTAKE, POST-REPAIR, FLOOR-TEST, FINAL, CALIBRATION, ATP, PUNCH-LIST, AUDIT, REPAIRS-COMPLETED, CARRYOVER.'],
 ['Photo zips','Each PDF download also saves a zip of its photos with the same name. ATP and DD1149 photos get their own zip. Tablets may ask permission for multiple downloads.'],
 ['Folder front page','Built from Intake. Platform serial large, plus the Intake QR and downstream checks as paper tick boxes.'],
 ['Intake PDF order','1. Folder front page (folder sleeve). 2. Bin tag page with serial and any upfit serial (property bin). 3. The rest of the Intake report.'],
 ['Windows key','Captured with the ATP server serial. Prints on the ATP PDF and the email.'],
 ['DD1149','Required whenever a truck is about to be delivered: after ATP and after PIVCO.']]}
};
var TV={};try{TV=JSON.parse(localStorage.getItem('wf_times')||'{}')||{};}catch(e){TV={};}
function fmtH(x){return (Math.round(x*100)/100)+' h';}
function wireTimes(k){
  function sum(){
    var tot=0;
    Array.prototype.forEach.call(view.querySelectorAll('.lane'),function(l){
      var t=0;Array.prototype.forEach.call(l.querySelectorAll('input[data-t]'),function(i){t+=parseFloat(i.value)||0;});
      l.querySelector('.sub').textContent=t?fmtH(t):''; tot+=t;});
    var el=document.getElementById('total');
    if(el){var days=tot/8;el.innerHTML='<b>Estimated total</b> <span>'+fmtH(tot)+(tot?' &middot; about '+(Math.round(days*10)/10)+' working days at 8 h':'')+'</span>';}
  }
  view.addEventListener('input',function(e){var i=e.target.closest('input[data-t]');if(!i)return;TV[i.dataset.t]=i.value;try{localStorage.setItem('wf_times',JSON.stringify(TV));}catch(x){}sum();});
  sum();
}
var tabs=document.getElementById('tabs'),view=document.getElementById('view'),keys=Object.keys(PATHS);
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function render(k){
  var p=PATHS[k],h='';
  Array.prototype.forEach.call(tabs.children,function(b){b.setAttribute('aria-selected',b.dataset.k===k?'true':'false');});
  if(p.rules){
    h='<p class="blurb">The rules every form follows.</p><div class="rules">'+p.rules.map(function(r){return '<div class="rule"><h3>'+esc(r[0])+'</h3><p>'+r[1]+'</p></div>';}).join('')+'</div>';
  }else{
    var n=0;
    h='<p class="blurb">'+esc(p.blurb)+(p.proposed?'<span class="tag">Proposed</span>':'')+'</p><div class="lanes">'+p.lanes.map(function(l){
      return '<section class="lane"><h2>'+esc(l.n)+(p.time?'<span class="sub" data-lane="'+esc(l.n)+'"></span>':'')+'</h2><ol class="steps">'+l.s.map(function(s){
        n++; var tid=k+':'+n, tm=(p.time&&s[0]!==D)?'<label class="tm">Est. hours <input type="number" inputmode="decimal" min="0" step="0.25" data-t="'+tid+'" value="'+esc(TV[tid]||'')+'" aria-label="Estimated hours for '+esc(s[1])+'"></label>':''; var br=s.slice(3).map(function(b){return '<span><em>'+esc(b[0]).toUpperCase()+'</em>'+esc(b[1])+'</span>';}).join('');
        return '<li class="step '+s[0]+'"><span class="n">'+n+'</span><b>'+esc(s[1])+'</b>'+(s[2]?'<p>'+esc(s[2])+'</p>':'')+(br?'<div class="br">'+br+'</div>':'')+tm+'</li>';
      }).join('')+'</ol></section>';}).join('')+'</div>'+(p.time?'<div class="total" id="total"></div>':'')+(p.note?'<p class="note">'+esc(p.note)+'</p>':'');
  }
  view.innerHTML=h; if(p.time){wireTimes(k);}
  try{history.replaceState(null,'','#'+k);}catch(e){}
}
tabs.innerHTML=keys.map(function(k){return '<button role="tab" data-k="'+k+'">'+esc(PATHS[k].label)+'</button>';}).join('');
tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(b)render(b.dataset.k);});
var start=(location.hash||'').slice(1);render(PATHS[start]?start:'repair');
</script>
<script>/* ===== shared: on-screen Back / Home bar (Ravi, 2026-11-04) =====

(function(){if(window.Nav)return;
var A=null,stack=[],cur=null,busy=0,tm=null,HOME='../',NAME='';
var CSS='#navBar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0b3d6b;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}'+
 '.gpn-h b{flex:1;text-align:center}#navBar b{flex:1;text-align:center;font:700 17px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'+
 '#navBar button,.gpn-h button.nb{min-height:48px;min-width:96px;border-radius:10px;border:2px solid #fff;background:#fff;color:#0b3d6b;font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;padding:0 14px;touch-action:manipulation}'+
 ':root{--navh:44px}html{scroll-padding-top:calc(var(--navh) + 50px)}.top,header.bar{top:var(--navh)!important}'+
 '#navBar{padding:4px 10px!important;gap:8px!important}#navBar b{font-size:15px!important}#navBar button,.gpn-h button.nb{min-height:36px!important;min-width:72px!important;font-size:15px!important;padding:0 12px!important;border-width:1px!important;border-radius:8px!important}'+

function key(s){try{return JSON.stringify(s);}catch(e){return '';}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sameOrigin(r){try{return !!r&&new URL(r).origin===location.origin;}catch(e){return false;}}
function note(){if(busy||!A||!A.snap)return;var s;try{s=A.snap();}catch(e){return;}if(!s)return;if(cur&&key(s)===key(cur))return;if(cur){stack.push(cur);if(stack.length>60)stack.shift();}cur=s;}
function sched(){if(tm)return;tm=setTimeout(function(){tm=null;note();},120);}
function home(){var d=false,go=function(){if(d)return;d=true;location.href=HOME;};try{var p=A&&A.save&&A.save();if(p&&p.then){p.then(go,go);setTimeout(go,1500);return;}}catch(e){}go();}
function overlay(){var g=document.getElementById('genPanel');if(g){var c=g.querySelector('[data-pt="gpclose"]');if(c){c.click();return true;}}return false;}
function back(){if(overlay())return;
 if(!A||!A.restore){if(sameOrigin(document.referrer)&&history.length>1)history.back();else home();return;}
 note();if(!stack.length){home();return;}
 var s=stack.pop();busy++;cur=s;var p;try{p=A.restore(s);}catch(e){p=null;}
 Promise.resolve(p).catch(function(){}).then(function(){setTimeout(function(){busy=Math.max(0,busy-1);},200);});}
function mount(){if(document.getElementById('navBar')||!document.body)return;
 var st=document.createElement('style');st.id='navCss';st.textContent=CSS;(document.head||document.documentElement).appendChild(st);
 var b=document.createElement('div');b.id='navBar';b.innerHTML='<button type="button" data-nav="back">‹ Back</button><b>'+esc(NAME||document.title||'')+'</b><button type="button" data-nav="home">⌂ Home</button>';
 document.body.insertBefore(b,document.body.firstChild);document.documentElement.style.setProperty('--navh',b.offsetHeight+'px');
 try{new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});}catch(e){}sched();}
document.addEventListener('pointerdown',function(){note();},true);
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('[data-nav]');if(!b)return;ev.preventDefault();ev.stopPropagation();if(b.getAttribute('data-nav')==='home')home();else back();},true);
window.Nav={dbg:function(){return {stack:stack.slice(),cur:cur};},init:function(o){A=o||{};NAME=A.name||'';mount();},back:back,home:home};
})();</script><script>Nav.init({name:document.title});</script>

function ensure(){if(!document.body)return;var nb=document.getElementById('navBar'),ex=document.querySelector('[data-theme-tog2]');

 var b=document.createElement('button');b.type='button';b.setAttribute('data-theme-tog2','');b.setAttribute('aria-label','Switch between light and dark mode');
