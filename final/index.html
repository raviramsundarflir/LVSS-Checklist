        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

/* shared platform-serial helpers. ADD A PLATFORM = add one line to PLATFORMS.
   c = QR/serial code (one letter, unique), pt = stored platform type, label = shown name,
   pfx = serial prefix, min = zero-pad width, rx = regex that recognises a typed prefix,
   fam = 'E' uses the eMSC-L equipment list (network enclosure, Starlink...), 'L' uses the LVSS list. */
var PLATFORMS=[
 {c:'L',pt:'LVSS',label:'LVSS',pfx:'LVSS-',min:3,rx:'lvss',fam:'L'},
 {c:'E',pt:'EMSCL',label:'eMSC-L',pfx:'eMSC-L ',min:4,rx:'e?msc[-\\s_]*l?',fam:'E'},
 {c:'M',pt:'M2S2',label:'M2S2',pfx:'M2S2 ',min:4,rx:'m2s2',fam:'E'}
];
var SN_RX=new RegExp('^\\s*(?:'+PLATFORMS.map(function(p){return '('+p.rx+')';}).join('|')+')[-\\s_]*','i');
function platByC(c){for(var i=0;i<PLATFORMS.length;i++)if(PLATFORMS[i].c===c)return PLATFORMS[i];return null;}
function platByPt(pt){for(var i=0;i<PLATFORMS.length;i++)if(PLATFORMS[i].pt===pt)return PLATFORMS[i];return PLATFORMS[0];}
function ptOfCode(c){var p=platByC(c);return p?p.pt:'LVSS';}
function codeOfPt(pt){return platByPt(pt).c;}
function platLabel(pt){return platByPt(pt).label;}
function isEm(pt){return platByPt(pt).fam==='E';}
function snType(s){var m=SN_RX.exec(String(s||''));if(!m)return '';for(var i=0;i<PLATFORMS.length;i++)if(m[i+1]!==undefined)return PLATFORMS[i].c;return '';}
function snDig(s){return String(s||'').replace(SN_RX,'').trim();}
function snMake(t,s){var P=platByC(t)||PLATFORMS[0],d=snDig(s);if(/^\d+$/.test(d)){d=d.replace(/^0+(?=\d)/,'');d=('0000'+d).slice(-Math.max(d.length,P.min));}if(!d)return P.pfx;return P.pfx+d;}
/* put platform pt's prefix on serial s (any other known prefix is replaced) */
function plSn(pt,s){var P=platByPt(pt),d=snDig(s);return d?P.pfx+d:P.label;}
/* serial after the platform type changes to pt */
function plSwitch(pt,s){s=String(s||'').trim();var P=platByPt(pt);if(/^\d+$/.test(snDig(s)))return snMake(P.c,s);if(snType(s)||isEm(pt))return plSn(pt,s);return s;}
/* display form of a stored serial: typed prefix wins; bare digits get dflt (default eMSC-L) */
function snShow(s,dflt){s=String(s||'').trim();if(!s)return '';var t=snType(s);if(t){return platByC(t).pfx+snDig(s);}if(/^[A-Za-z]/.test(s)||dflt===null)return s;return (platByC(dflt)||platByC('E')).pfx+s;}
function snFile(s,dflt){s=snShow(s,dflt);var t=snType(s);var n=snDig(s);var p=t?platByC(t).label:'';var raw=(p?p+'_':'')+(p?n:s);return raw.replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'no-serial';}
function snTg(id,val){var t=snType(val);return '<span class="sntg" style="display:inline-flex;flex-wrap:wrap;gap:4px;margin:4px 0 0">'+PLATFORMS.map(function(p){var x=[p.c,p.label];return '<button type="button" class="sntb'+(t===x[0]?' on':'')+'" data-sn="'+x[0]+'" data-for="'+id+'" style="min-height:36px;padding:4px 12px;border-radius:8px;border:1.5px solid #8a94a6;background:'+(t===x[0]?'#1d3b6a':'#fff')+';color:'+(t===x[0]?'#fff':'#333')+';font:600 14px system-ui,sans-serif;cursor:pointer">'+x[1]+'</button>';}).join('')+'</span>';}

function platBtns(act,cur){return PLATFORMS.map(function(p){return '<button class="'+(cur===p.pt?'pri':'')+'" data-act="'+act+'" data-v="'+p.pt+'" style="flex:1;min-width:84px">'+p.label+'</button>';}).join('');}

var DEV_ORDER=['starlink','server','cisco switch','trimble gps','radar','pan tilt','camera','gearbox','cisco receiver','cisco wifi module','cisco pim / lte module','laptop control unit','hmi/smu','client'];

 'gear box':'gearbox','gearbox serial number':'gearbox','network encl. cisco router serial number':'cisco receiver','cisco router':'cisco receiver','cisco receiver serial number':'cisco receiver',
 'network encl. cisco module sn':'cisco wifi module','cisco module':'cisco wifi module','wifi module':'cisco wifi module','cisco wifi module serial number':'cisco wifi module',
