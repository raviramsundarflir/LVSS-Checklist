<!DOCTYPE html>
<html lang="en"><head><script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('tscTheme')==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pan-Tilt Moving Base ATP/ATR</title><meta name="theme-color" content="#0b6e7a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--blue:#0b6e7a;--blue2:#d9f0f4;--ink:#1b2430;--mut:#6b7686;--line:#d5dce6;--bg:#f3f5f8;--pass:#1b8a3a;--fail:#c62828;--warn:#c25a00;--awp:#6a2fb0;--todo:#fff7d1;--todoL:#f0dc7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.38 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea,select{font-size:max(16px,1em)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
button.dng{color:var(--fail);border-color:#e3b3b3}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border:1px solid #bcc6d4;border-radius:8px;background:#fff;color:var(--ink);min-height:42px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:0 0 3px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.top img{height:30px}
.brand{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.steps{display:flex;gap:4px;padding:0 10px 8px}
.steps button{flex:1;min-width:0;min-height:40px;padding:6px 4px;font-size:14px;background:#eef1f6;border-color:#eef1f6}
.steps button.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.steps button.dn::after{content:" ✓"}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut);font-size:13px}
.credit{margin:18px 0 26px;text-align:center;font-size:11px;color:#9aa3b0}
.lock{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.lock img{height:44px;margin-bottom:10px}
.lock input{font-size:34px;letter-spacing:.5em;text-align:center;padding:12px 8px 12px 20px}
.err{color:var(--fail);font-weight:700;min-height:24px;margin:8px 0}
.warn{color:var(--warn);font-weight:600}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .i{flex:1;min-width:200px}
.rec b{font-size:17px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;background:#e3e7ee;color:#445}
.tag.p{background:#e3f6ea;color:var(--pass)}.tag.f{background:#fdecec;color:var(--fail)}.tag.w{background:#fff0dd;color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:2px solid var(--line);border-radius:20px;padding:6px 12px;min-height:40px;font-weight:600;font-size:14px;background:#fff}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hist{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 2px;font-size:12px;color:var(--mut)}
.hist button{min-height:32px;padding:3px 10px;font-size:13px;border-radius:16px}
.stp{background:#fff;border:1px solid var(--line);border-left:8px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;scroll-margin-top:150px}
.stp.todo{background:var(--todo);border-left-color:var(--todoL)}
.stp.ans{background:#fff;border-left-color:#bfe3c9}
.stp.fail{background:#fff4f4;border-left-color:var(--fail)}
.stp.nt{background:#fff6ea;border-left-color:var(--warn)}
.stp.awp{background:#f6f0fc;border-left-color:var(--awp)}
.stp.na{background:#f4f5f7;border-left-color:#98a2b3}
.grp{background:var(--blue2);font-weight:700;padding:9px 12px;border-radius:8px;margin:16px 0 8px;font-size:15px}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.num{font-weight:800;color:var(--blue);font-size:15px}
.kd{font-size:12px;color:var(--mut)}
.vd{margin-left:auto;font-weight:800;border-radius:8px;padding:2px 10px;font-size:13px;white-space:nowrap}
.vd.p{background:#e3f6ea;color:var(--pass)}.vd.f{background:#fdecec;color:var(--fail)}.vd.n{background:#e8ebf0;color:#556}.vd.w{background:#fff0dd;color:var(--warn)}.vd.a{background:#eadcf8;color:var(--awp)}
.sa p{margin:0 0 5px}
.sa .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef2f7;border-radius:6px;padding:3px 8px;display:inline-block;margin:1px 0}
.sx{margin-top:6px;padding:7px 10px;border-radius:8px;background:rgba(11,110,122,.07);font-size:14px}
.sx p{margin:0 0 3px}.sx b{color:var(--blue)}
.sf{font-size:12.5px;color:var(--mut);margin-top:5px}
.ctl{margin-top:10px}
.sb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sb button{min-height:50px;padding:6px 2px;font-weight:700;font-size:14px;line-height:1.15}
.sb button.sg{border-style:dashed;border-width:2px}
.sb button.on.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.sb button.on.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.sb button.on.na{background:#7b8696;border-color:#7b8696;color:#fff}
.sb button.on.nt{background:var(--warn);border-color:var(--warn);color:#fff}
.sb button.on.awp{background:var(--awp);border-color:var(--awp);color:#fff}
.sb.l4{grid-template-columns:repeat(4,1fr)}
.dn{width:100%;min-height:52px;font-weight:700;font-size:16px}
.dn.on{background:var(--pass);border-color:var(--pass);color:#fff}
.rdg{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.rdg>div{flex:1 1 170px;min-width:150px}
.rdg .u{display:flex;gap:6px;align-items:center}.rdg .u span{font-weight:700;color:var(--mut)}
.hint{margin-top:6px;font-size:13.5px;min-height:0}
.hint.sg{color:var(--blue);font-weight:600}.hint.ow{color:var(--warn);font-weight:600}.hint.ok{color:var(--pass);font-weight:600}
.nt-w{margin-top:8px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ph .t{position:relative}.ph img{height:70px;border-radius:8px;border:1px solid var(--line);display:block}
.ph .add{min-height:40px;padding:6px 12px;font-size:14px}
.redo{margin-top:10px;padding:10px;border:1px dashed var(--warn);border-radius:10px;background:#fff8ee;font-size:14px}
.redo button{margin-top:6px}
.mx{margin:8px 0 4px;overflow-x:auto}
.mx table{border-collapse:collapse;margin:6px 0}
.mx td,.mx th{padding:0;text-align:center}
.mx th{font-size:13px;color:var(--mut);width:44px;height:30px}
.mx th.rl{font-weight:800;color:var(--ink)}
.mc{width:42px;height:38px;min-height:0;padding:0;border-radius:6px;font-size:12px;border:1px solid #c2cad6;background:#fff;color:#5b6678;position:relative}
.mc.o{background:#e3f6ea;border-color:var(--pass);color:var(--pass);font-weight:700}
.mc.x{background:#fdecec;border-color:var(--fail);color:var(--fail);font-weight:800}
.mc.tc{border:2px dashed var(--warn)}
.mc.o::after{content:"";position:absolute;inset:4px;border:2px solid var(--pass);border-radius:50%}
.mc.x::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--fail)}
.mxb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sum{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:14px;align-items:center}
.sum .k{color:var(--mut)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.kpi{flex:1 1 90px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;background:#fff}
.kpi b{display:block;font-size:22px}
.kpi.todo{background:var(--todo);border-color:var(--todoL)}
.ml{display:block;width:100%;text-align:left;margin:0 0 6px}
.cf{width:100%;min-height:50px;font-weight:700;margin-top:6px}
.cf.on{background:var(--pass);border-color:var(--pass);color:#fff}
.nav{display:flex;gap:10px;margin:6px 0 10px}.nav button{flex:1;min-height:54px;font-size:16px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal h3{margin:0 0 8px}.modal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal .acts button{flex:1 1 120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw}
.sigbox{border:2px dashed #9aa6b8;border-radius:10px;background:#fff;touch-action:none;width:100%;height:190px;display:block}
.sigimg{max-height:70px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.tgl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:4px 0}
.tgl .bx{flex:none;width:26px;height:26px;border:2px solid #8a94a6;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.tgl.on .bx{background:var(--blue);border-color:var(--blue)}
.big{width:100%;min-height:62px;font-size:18px;font-weight:800}
.stk{background:#eef7f8;border:1px solid #bfe0e5;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
@media(max-width:560px){.sb button{font-size:12.5px;min-height:54px}.mc{width:31px;height:34px}.mx th{width:31px}.wrap{padding:10px}.steps button{font-size:12.5px}}

const pad2=n=>String(n).padStart(2,'0');
function hm(t){const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function mdy(t){const d=new Date(t);return pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+'/'+d.getFullYear();}
function mdy2(t){const d=new Date(t);return pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'-'+String(d.getFullYear()).slice(2);}
function isoToMdy(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[2]+'/'+m[3]+'/'+m[1]:(s||'');}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* history of earlier entries (offered again on this tablet) */
function hist(k){try{const a=JSON.parse(LS.get('mvb:h:'+k)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function remember(k,v){v=String(v||'').trim();if(!k||!v)return;let a=hist(k).filter(x=>x.toLowerCase()!==v.toLowerCase());a.unshift(v);LS.set('mvb:h:'+k,JSON.stringify(a.slice(0,8)));}
function histHtml(k,target,n){const a=hist(k).slice(0,n||4);if(!a.length)return '';return '<div class="hist"><span>Used before:</span>'+a.map(x=>'<button type="button" data-act="chip" data-t="'+esc(target)+'" data-v="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>';}
/* photos in IndexedDB */
const PH={};let _db=null;
function idb(){if(_db)return _db;_db=new Promise((res,rej)=>{try{const q=indexedDB.open('mvb-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});return _db;}
async function phPut(id,v){PH[id]=v;try{const d=await idb();await new Promise((r,j)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=r;t.onerror=()=>j(t.error);});}catch(e){}}
async function phGet(id){if(PH[id])return PH[id];try{const d=await idb();const v=await new Promise((r,j)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});if(v)PH[id]=v;return v||'';}catch(e){return '';}}
async function phDel(id){delete PH[id];try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(id);}catch(e){}}
function hydrate(root){$$('img[data-pid]',root).forEach(async im=>{if(im.src&&im.dataset.ok)return;const v=await phGet(im.dataset.pid);if(v){im.src=v;im.dataset.ok=1;}});}
/* ---------- helpers: modals, toast ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function dlg(html){return new Promise(res=>{const s=document.createElement('div');s.className='scrim';s.innerHTML='<div class="modal" role="dialog">'+html+'</div>';document.body.appendChild(s);const done=v=>{s.remove();res(v);};
 s.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){done(b.dataset.r);}});s._done=done;});}
const ask=(title,msg,btns)=>dlg('<h3>'+esc(title)+'</h3><div>'+msg+'</div><div class="acts">'+btns.map(b=>'<button class="'+(b[2]||'')+'" data-r="'+esc(b[0])+'">'+esc(b[1])+'</button>').join('')+'</div>');
/* ---------- record ---------- */
function newRec(model,why,whyNote,carry){const m=T.models.find(x=>x.id===model);
 const r={id:uid(),created:Date.now(),updated:Date.now(),model,why,whyNote:whyNote||'',hdr:{sn:'',prev:'',mfg:'',rma:'',svo:'',acct:'',wbs:'',sp:[]},eq:{},swv:'',tech:'',st:{},mx:{radar:{},cam:{}},att:[],sig:{t:{},qi:{},qa:{}},conf:{},notes:'',send:{to:'',tsc:false}};
 const p=RECS&&carry&&carry.from?RECS[carry.from]:null;
 if(p&&carry.eq){r.eq=JSON.parse(JSON.stringify(p.eq||{}));r.swv=p.swv||'';}
 if(p&&carry.tech){r.tech=p.tech||'';}
 if(p&&carry.job){['rma','svo','acct','wbs'].forEach(k=>r.hdr[k]=p.hdr[k]||'');}
 autoApply(r);return r;}
function allSteps(){const a=[];T.pages.forEach(p=>(T.steps[p.id]||[]).forEach(s=>a.push(s)));return a;}
function stepById(id){return allSteps().find(s=>s.id===id);}
function stOf(r,id){return r.st[id]||(r.st[id]={});}
function autoApply(r){allSteps().forEach(s=>{
 if(s.only&&r.model!==s.only){const x=stOf(r,s.id);if(!x.s||x.auto){x.s='na';x.auto=1;x.sug=0;}}
 else if(s.only){const x=r.st[s.id];if(x&&x.auto){x.s='';x.auto=0;}}
 if(s.parts&&s.partDef){const x=stOf(r,s.id);if(!x.part)x.part=s.partDef[r.model]||'';}});}
function num(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function suggest(s,r){const x=r.st[s.id]||{},v=x.v||{};
 if(s.mx){const m=r.mx[s.mx]||{},cells=T.mx[s.mx].cells;let any=false,all=true;for(const c of cells){const k=c.r+'|'+c.c,st=m[k];if(st==='x')return 'fail';if(st==='o')any=true;else if(!c.tc)all=false;}return any&&all?'pass':null;}
 if(s.rd){const n=num(v[s.rd.key]);if(n==null)return null;if(s.rd.absMax!=null)return Math.abs(n)<=s.rd.absMax+1e-9?'pass':'fail';if(s.rd.max!=null)return(n>(s.rd.min||0)&&n<=s.rd.max+1e-9)?'pass':'fail';}
 if(s.opt){const tl=s.opt.filter(o=>o.tol);if(tl.length){let out=false,all=true;tl.forEach(o=>{const n=num(v[o.key]);if(n==null)all=false;else if(Math.abs(n-o.tol[0])>o.tol[1]+1e-9)out=true;});if(out)return 'fail';if(all)return 'pass';}}
 return null;}
function status(s,r){const x=r.st[s.id]||{};if(s.k==='do')return x.s==='done'?'done':'';return x.s||'';}
function answered(s,r){const x=r.st[s.id]||{};if(s.k==='do')return x.s==='done';return !!x.s&&!x.sug;}
function lineSteps(){return allSteps().filter(s=>s.k==='res'||s.k==='line');}
function result(r){let f=0,inc=0;lineSteps().forEach(s=>{const x=r.st[s.id]||{};if(x.sug||!x.s)inc++;else if(x.s==='fail')f++;else if(x.s==='nt'||x.s==='awp')inc++;});return f?'FAIL':inc?'INCOMPLETE':'PASS';}
function counts(r){const c={pass:0,fail:0,na:0,nt:0,awp:0,todo:0,tot:0};lineSteps().forEach(s=>{c.tot++;const x=r.st[s.id]||{};if(x.sug||!x.s)c.todo++;else if(x.s==='done')c.pass++;else c[x.s]=(c[x.s]||0)+1;});return c;}
function modelOf(r){return T.models.find(m=>m.id===r.model)||T.models[0];}
function jobLine(r){const h=r.hdr;if(h.wbs)return 'WBS '+h.wbs;return [h.rma&&'RMA '+h.rma,h.svo&&'SVO '+h.svo,h.acct&&'Acct '+h.acct].filter(Boolean).join(' · ');}
function whyText(r){return r.why==='Other'?(r.whyNote||'Other'):r.why;}

 h+='<div class="ctl">';

function hintFor(s,r){const x=r.st[s.id]||{},v=x.v||{};let cl='',t='';const sg=suggest(s,r);

 else if(sg&&x.s&&(x.s==='pass'||x.s==='fail')&&sg!==x.s){cl='ow';t='The '+(s.mx?'connection marks':'readings')+' suggest <b>'+SLAB[sg]+'</b>.';}

 if(s.rd&&s.rd.absMax!=null){const n=num(v[s.rd.key]);if(n!=null&&Math.abs(n)>s.rd.absMax){cl='ow';t=(t?t+'<br>':'')+'Outside ±'+s.rd.absMax+'°.';}}

function logAttempt(s){if(!s.redo)return;const r=S.rec,x=stOf(r,s.id);let a=r.att.slice().reverse().find(z=>z.id===s.id&&z.open);const val=(x.v||{})[s.rd&&s.rd.key]||'';
